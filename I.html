<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل إيميلات المحاكم والدوائر القضائية - جميع مناطق المملكة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF5;
    --ink:#182420;
    --ink-soft:#4B5B54;
    --brand:#0E4D3C;
    --brand-dark:#0A362A;
    --gold:#B8892B;
    --gold-soft:#E7D9B4;
    --line:#DDD6C2;
    --card:#FFFFFF;
    --danger:#A23B2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    line-height:1.6;
  }
  header{
    background:linear-gradient(180deg,var(--brand),var(--brand-dark));
    color:#F6F1E4;
    padding:36px 20px 28px;
    text-align:center;
    border-bottom:4px solid var(--gold);
    position:relative;
  }
  header::before, header::after{
    content:"";
    position:absolute;
    right:0; left:0;
    height:1px;
    background:rgba(246,241,228,0.35);
  }
  header::before{ top:8px; }
  header::after{ bottom:8px; }
  h1{
    font-family:'Aref Ruqaa',serif;
    font-weight:700;
    font-size:clamp(22px,4vw,34px);
    margin:0 0 8px;
    letter-spacing:0.5px;
  }
  header p{
    margin:0;
    color:var(--gold-soft);
    font-size:14px;
  }
  .firm-brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid rgba(246,241,228,0.25);
  }
  .firm-brand img{
    height:40px;
    width:auto;
    display:block;
  }
  .firm-brand span{
    font-family:'Tajawal',sans-serif;
    font-size:12px;
    color:rgba(246,241,228,0.75);
  }

  .wrap{
    max-width:800px;
    margin:0 auto;
    padding:22px 16px 80px;
  }

  .search-bar{
    position:sticky;
    top:0;
    background:var(--bg);
    padding:14px 0 12px;
    z-index:5;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .search-bar input[type="text"]{
    flex:1;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    background:var(--card);
    color:var(--ink);
  }
  .search-bar input[type="text"]:focus{
    outline:none;
    border-color:var(--brand);
  }
  .edit-toggle{
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    border-radius:10px;
    padding:0 14px;
    height:47px;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .edit-toggle.on{
    background:var(--brand);
    color:#fff;
    border-color:var(--brand);
  }

  .status{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 2px 14px;
    min-height:16px;
  }
  .stats-line{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 2px 14px;
  }

  /* Region level */
  section.region{
    margin-bottom:14px;
    border:1px solid var(--gold);
    border-radius:12px;
    background:var(--card);
    overflow:hidden;
  }
  section.region > summary{
    list-style:none;
    cursor:pointer;
    padding:15px 16px;
    font-family:'Aref Ruqaa',serif;
    font-size:20px;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(180deg,var(--brand),var(--brand-dark));
  }
  section.region > summary::-webkit-details-marker{ display:none; }
  section.region > summary::after{
    content:"︿";
    display:inline-block;
    transform:rotate(180deg);
    color:var(--gold-soft);
    font-size:14px;
  }
  section.region[open] > summary::after{ transform:rotate(0deg); }
  .region-count{
    font-family:'Tajawal',sans-serif;
    font-size:12px;
    color:var(--gold-soft);
    font-weight:500;
  }
  .region-body{ padding:10px; }

  /* Governorate level */
  section.gov{
    margin-bottom:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    overflow:hidden;
  }
  section.gov > summary{
    list-style:none;
    cursor:pointer;
    padding:12px 14px;
    font-family:'Aref Ruqaa',serif;
    font-size:17px;
    color:var(--brand-dark);
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#F6F2E6;
  }
  section.gov > summary::-webkit-details-marker{ display:none; }
  section.gov > summary::after{
    content:"︿";
    display:inline-block;
    transform:rotate(180deg);
    color:var(--gold);
    font-size:13px;
  }
  section.gov[open] > summary::after{ transform:rotate(0deg); }
  .gov-count{
    font-family:'Tajawal',sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .court{
    border-top:1px solid var(--line);
  }
  .court-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 16px 6px;
    background:#FCFBF6;
  }
  .court-head .num{
    flex:0 0 24px;
    color:var(--gold);
    font-weight:700;
    font-size:13px;
  }
  .court-name{
    flex:1;
    font-weight:700;
    font-size:14px;
    color:var(--brand-dark);
  }
  .court-name input{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    font-weight:700;
  }

  .circuit-list{
    padding:2px 16px 12px;
  }
  .circuit-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    padding:8px 0 8px 0;
    margin-right:26px;
    border-top:1px dashed var(--line);
  }
  .circuit-row .c-num{
    flex:0 0 20px;
    color:var(--ink-soft);
    font-size:12px;
  }
  .circuit-row .c-name{
    flex:1 1 140px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .circuit-row .c-name input{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 9px;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
  }
  .email-wrap{
    flex:1 1 200px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .email-wrap input{
    flex:1;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:13px;
    font-family:'Tajawal',sans-serif;
    direction:ltr;
    text-align:right;
    color:var(--brand-dark);
    background:#FCFBF7;
  }
  .email-wrap input:read-only{
    background:transparent;
    border-color:transparent;
    color:var(--ink-soft);
  }
  .email-wrap input:read-only:not([value=""]){
    color:var(--brand-dark);
  }
  .icon-btn{
    border:none;
    background:transparent;
    cursor:pointer;
    font-size:15px;
    padding:6px 8px;
    border-radius:8px;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--gold-soft); }
  .icon-btn.del{ color:var(--danger); }

  .add-circuit-btn{
    margin-right:26px;
    margin-top:6px;
    background:none;
    border:1px dashed var(--line);
    color:var(--ink-soft);
    border-radius:8px;
    padding:6px 12px;
    font-family:'Tajawal',sans-serif;
    font-size:12px;
    cursor:pointer;
  }
  .add-circuit-btn:hover{ border-color:var(--brand); color:var(--brand); }

  .add-row{
    padding:10px 16px 14px;
    border-top:1px solid var(--line);
  }
  .add-row button{
    background:none;
    border:1.5px dashed var(--line);
    color:var(--ink-soft);
    border-radius:8px;
    padding:9px 14px;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    cursor:pointer;
    width:100%;
  }
  .add-row button:hover{ border-color:var(--brand); color:var(--brand); }

  .empty-msg{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 16px;
    font-size:14px;
  }

  .add-region{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .add-region input{
    flex:1;
    padding:11px 14px;
    border:1.5px dashed var(--gold);
    border-radius:10px;
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    background:transparent;
  }
  .add-region button{
    border:1.5px solid var(--brand);
    background:var(--brand);
    color:#fff;
    border-radius:10px;
    padding:0 18px;
    font-family:'Tajawal',sans-serif;
    cursor:pointer;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:var(--brand-dark);
    color:#F6F1E4;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:20;
  }
  .toast.show{ opacity:1; }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,20,16,0.55);
    align-items:center;
    justify-content:center;
    z-index:30;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--card);
    border-radius:14px;
    padding:20px;
    max-width:340px;
    width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    font-family:'Tajawal',sans-serif;
  }
  .modal-box p{
    margin:0 0 14px;
    font-size:15px;
    color:var(--ink);
  }
  .modal-box input{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    margin-bottom:14px;
    direction:rtl;
  }
  .modal-actions{
    display:flex;
    gap:8px;
  }
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .modal-actions .modal-primary{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
  }
  .modal-actions .modal-danger{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
  }

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
    padding:10px 20px 30px;
  }
</style>
</head>

<script>
const STORAGE_KEY = 'national-courts-data-v1';
const EDIT_PASSWORD = "مكة2026";

let data = null;
let editMode = false;

const listRoot = document.getElementById('listRoot');
const searchInput = document.getElementById('searchInput');
const statusLine = document.getElementById('statusLine');
const statsLine = document.getElementById('statsLine');
const toast = document.getElementById('toast');
const modalOverlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toast.classList.remove('show'), 1800);
}

function closeModal(){
  modalOverlay.classList.remove('show');
  modalBox.innerHTML = '';
}
function showPasswordModal(onSubmit){
  modalBox.innerHTML = `
    <p>أدخل كلمة المرور لفتح وضع التعديل:</p>
    <input type="password" id="modalPassInput" placeholder="كلمة المرور" autocomplete="off">
    <div class="modal-actions">
      <button id="modalCancelBtn">إلغاء</button>
      <button id="modalOkBtn" class="modal-primary">دخول</button>
    </div>`;
  modalOverlay.classList.add('show');
  const input = document.getElementById('modalPassInput');
  setTimeout(()=> input.focus(), 50);
  const submit = ()=>{ const val = input.value; closeModal(); onSubmit(val); };
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalOkBtn').addEventListener('click', submit);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
}
function showConfirmModal(message, onYes){
  modalBox.innerHTML = `
    <p>${message}</p>
    <div class="modal-actions">
      <button id="modalCancelBtn">إلغاء</button>
      <button id="modalOkBtn" class="modal-danger">حذف</button>
    </div>`;
  modalOverlay.classList.add('show');
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalOkBtn').addEventListener('click', ()=>{ closeModal(); onYes(); });
}

function copyEmail(email){
  if(!email){ showToast('لا يوجد بريد إلكتروني بعد'); return; }
  navigator.clipboard.writeText(email).then(()=> showToast('تم نسخ البريد الإلكتروني'));
}

async function loadData(){
  statusLine.textContent = 'جاري تحميل البيانات...';
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      data = JSON.parse(res.value);
    } else {
      data = JSON.parse(document.getElementById('site-data-script').textContent);
    }
  } catch(e){
    data = JSON.parse(document.getElementById('site-data-script').textContent);
  }
  statusLine.textContent = '';
  updateStats();
  render();
}

let saveTimer = null;
async function saveData(){
  statusLine.textContent = 'جاري الحفظ...';
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(data), true);
    statusLine.textContent = 'تم الحفظ ✓';
    setTimeout(()=>{ if(statusLine.textContent === 'تم الحفظ ✓') statusLine.textContent=''; }, 1500);
  } catch(e){
    statusLine.textContent = 'تعذر الحفظ، حاول مرة أخرى';
  }
  updateStats();
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 500);
}

function updateStats(){
  let govs=0, courts=0, circuits=0, filled=0;
  data.forEach(r=>{
    govs += r.govs.length;
    r.govs.forEach(g=>{
      courts += g.items.length;
      g.items.forEach(it=>{
        circuits += it.circuits.length;
        it.circuits.forEach(c=>{ if(c.email) filled++; });
      });
    });
  });
  statsLine.textContent = `${data.length} منطقة · ${govs} محافظة/مدينة · ${courts} محكمة · ${circuits} دائرة (${filled} بريد مُضاف)`;
}

/* ---------- Rendering ---------- */

function buildCircuitRow(court, ri, gi, ci, circuit){
  const cRow = document.createElement('div');
  cRow.className = 'circuit-row';

  const cNum = document.createElement('div');
  cNum.className = 'c-num';
  cNum.textContent = (circuit.idx + 1);
  cRow.appendChild(cNum);

  const cNameWrap = document.createElement('div');
  cNameWrap.className = 'c-name';
  if(editMode){
    const cNameInput = document.createElement('input');
    cNameInput.type = 'text';
    cNameInput.value = circuit.name;
    cNameInput.addEventListener('input', ()=>{
      data[ri].govs[gi].items[ci].circuits[circuit.idx].name = cNameInput.value;
      queueSave();
    });
    cNameWrap.appendChild(cNameInput);
  } else {
    cNameWrap.textContent = circuit.name;
  }
  cRow.appendChild(cNameWrap);

  const emailWrap = document.createElement('div');
  emailWrap.className = 'email-wrap';
  const emailInput = document.createElement('input');
  emailInput.type = 'text';
  emailInput.value = circuit.email || '';
  emailInput.placeholder = editMode ? 'أدخل البريد الإلكتروني...' : 'لم يُضف بعد';
  emailInput.readOnly = !editMode;
  if(editMode){
    emailInput.addEventListener('input', ()=>{
      data[ri].govs[gi].items[ci].circuits[circuit.idx].email = emailInput.value.trim();
      queueSave();
    });
  }
  emailWrap.appendChild(emailInput);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'icon-btn';
  copyBtn.title = 'نسخ البريد';
  copyBtn.textContent = '📋';
  copyBtn.addEventListener('click', ()=> copyEmail(circuit.email));
  emailWrap.appendChild(copyBtn);
  cRow.appendChild(emailWrap);

  if(editMode){
    const delCBtn = document.createElement('button');
    delCBtn.className = 'icon-btn del';
    delCBtn.title = 'حذف الدائرة';
    delCBtn.textContent = '✕';
    delCBtn.addEventListener('click', ()=>{
      data[ri].govs[gi].items[ci].circuits.splice(circuit.idx,1);
      queueSave();
      render();
    });
    cRow.appendChild(delCBtn);
  }
  return cRow;
}

function buildCourtBlock(ri, gi, court, courtIdx, circuitFilterFn){
  const courtBlock = document.createElement('div');
  courtBlock.className = 'court';

  const courtHead = document.createElement('div');
  courtHead.className = 'court-head';

  const courtNum = document.createElement('div');
  courtNum.className = 'num';
  courtNum.textContent = (courtIdx + 1) + '.';
  courtHead.appendChild(courtNum);

  const courtNameWrap = document.createElement('div');
  courtNameWrap.className = 'court-name';
  if(editMode){
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = court.name;
    nameInput.addEventListener('input', ()=>{
      data[ri].govs[gi].items[courtIdx].name = nameInput.value;
      queueSave();
    });
    courtNameWrap.appendChild(nameInput);
  } else {
    courtNameWrap.textContent = court.name;
  }
  courtHead.appendChild(courtNameWrap);

  if(editMode){
    const delCourtBtn = document.createElement('button');
    delCourtBtn.className = 'icon-btn del';
    delCourtBtn.title = 'حذف هذه المحكمة';
    delCourtBtn.textContent = '✕';
    delCourtBtn.addEventListener('click', ()=>{
      data[ri].govs[gi].items.splice(courtIdx,1);
      queueSave();
      render();
    });
    courtHead.appendChild(delCourtBtn);
  }
  courtBlock.appendChild(courtHead);

  const circuitList = document.createElement('div');
  circuitList.className = 'circuit-list';

  const circuitsWithIdx = court.circuits.map((c, idx) => ({...c, idx}));
  const circuitsToShow = circuitFilterFn ? circuitsWithIdx.filter(circuitFilterFn) : circuitsWithIdx;

  circuitsToShow.forEach(circuit => {
    circuitList.appendChild(buildCircuitRow(court, ri, gi, courtIdx, circuit));
  });

  if(editMode){
    const addCircuitBtn = document.createElement('button');
    addCircuitBtn.className = 'add-circuit-btn';
    const nextNum = court.circuits.length + 1;
    addCircuitBtn.textContent = '+ إضافة دائرة رقم ' + nextNum;
    addCircuitBtn.addEventListener('click', ()=>{
      data[ri].govs[gi].items[courtIdx].circuits.push({ name: 'الدائرة ' + nextNum, email: '' });
      queueSave();
      render();
    });
    circuitList.appendChild(addCircuitBtn);
  }

  courtBlock.appendChild(circuitList);
  return courtBlock;
}

function buildGovSection(ri, gov, govIdx, query){
  const section = document.createElement('section');
  section.className = 'gov';

  const summary = document.createElement('summary');
  summary.innerHTML = `<span>${gov.gov}</span>`;
  const rightWrap = document.createElement('span');
  rightWrap.style.display = 'flex';
  rightWrap.style.alignItems = 'center';
  rightWrap.style.gap = '8px';
  const countSpan = document.createElement('span');
  countSpan.className = 'gov-count';
  countSpan.textContent = gov.items.length + ' جهة';
  rightWrap.appendChild(countSpan);
  if(editMode){
    const delGovBtn = document.createElement('button');
    delGovBtn.className = 'icon-btn del';
    delGovBtn.title = 'حذف هذه المحافظة بالكامل';
    delGovBtn.textContent = '🗑';
    delGovBtn.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      showConfirmModal('حذف محافظة "' + gov.gov + '" وكل ما فيها؟', ()=>{
        data[ri].govs.splice(govIdx,1);
        queueSave();
        render();
      });
    });
    rightWrap.appendChild(delGovBtn);
  }
  summary.appendChild(rightWrap);
  section.appendChild(summary);

  const body = document.createElement('div');

  function renderGovBody(){
    body.innerHTML = '';
    const courtsWithIdx = gov.items.map((it, ii) => ({...it, idx: ii}));
    let courtsToShow = courtsWithIdx;
    if(query){
      courtsToShow = courtsWithIdx.filter(court => {
        if(court.name.toLowerCase().includes(query)) return true;
        return court.circuits.some(c => c.name.toLowerCase().includes(query) || (c.email||'').toLowerCase().includes(query));
      });
    }
    courtsToShow.forEach(court => {
      let circuitFilterFn = null;
      if(query && !court.name.toLowerCase().includes(query)){
        circuitFilterFn = (c)=> c.name.toLowerCase().includes(query) || (c.email||'').toLowerCase().includes(query);
      }
      body.appendChild(buildCourtBlock(ri, govIdx, court, court.idx, circuitFilterFn));
    });
    if(editMode){
      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ إضافة محكمة إلى ' + gov.gov;
      addBtn.addEventListener('click', ()=>{
        data[ri].govs[govIdx].items.push({ name: 'اسم جديد', circuits: [{ name: 'الدائرة الأولى', email: '' }] });
        queueSave();
        section.setAttribute('open','');
        render();
      });
      addRow.appendChild(addBtn);
      body.appendChild(addRow);
    }
  }

  let built = false;
  if(query){
    section.setAttribute('open','');
    renderGovBody();
    built = true;
  } else {
    section.addEventListener('toggle', ()=>{
      if(section.open && !built){ renderGovBody(); built = true; }
    });
  }
  section.appendChild(body);
  return section;
}

function buildRegionSection(region, ri, query){
  const section = document.createElement('section');
  section.className = 'region';

  const summary = document.createElement('summary');
  summary.innerHTML = `<span>${region.region}</span>`;
  const rightWrap = document.createElement('span');
  rightWrap.style.display = 'flex';
  rightWrap.style.alignItems = 'center';
  rightWrap.style.gap = '8px';
  const countSpan = document.createElement('span');
  countSpan.className = 'region-count';
  countSpan.textContent = region.govs.length + ' محافظة/مدينة';
  rightWrap.appendChild(countSpan);
  if(editMode){
    const delRegionBtn = document.createElement('button');
    delRegionBtn.className = 'icon-btn del';
    delRegionBtn.title = 'حذف هذه المنطقة بالكامل';
    delRegionBtn.textContent = '🗑';
    delRegionBtn.style.color = '#F6F1E4';
    delRegionBtn.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      showConfirmModal('حذف منطقة "' + region.region + '" وكل ما فيها؟', ()=>{
        data.splice(ri,1);
        queueSave();
        render();
      });
    });
    rightWrap.appendChild(delRegionBtn);
  }
  summary.appendChild(rightWrap);
  section.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'region-body';

  function renderRegionBody(){
    body.innerHTML = '';
    const govsWithIdx = region.govs.map((g, gi) => ({...g, idx: gi}));
    let govsToShow = govsWithIdx;
    if(query){
      govsToShow = govsWithIdx.filter(gov => {
        if(gov.gov.toLowerCase().includes(query)) return true;
        return gov.items.some(court => court.name.toLowerCase().includes(query) ||
          court.circuits.some(c => c.name.toLowerCase().includes(query) || (c.email||'').toLowerCase().includes(query)));
      });
    }
    if(query && govsToShow.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = 'لا توجد نتائج مطابقة في هذه المنطقة';
      body.appendChild(empty);
    }
    govsToShow.forEach(gov => {
      body.appendChild(buildGovSection(ri, gov, gov.idx, query));
    });
    if(editMode){
      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ إضافة محافظة/مدينة إلى ' + region.region;
      addBtn.addEventListener('click', ()=>{
        data[ri].govs.push({ gov: 'اسم جديد', items: [] });
        queueSave();
        section.setAttribute('open','');
        render();
      });
      addRow.appendChild(addBtn);
      body.appendChild(addRow);
    }
  }

  let built = false;
  if(query){
    section.setAttribute('open','');
    renderRegionBody();
    built = true;
  } else {
    section.addEventListener('toggle', ()=>{
      if(section.open && !built){ renderRegionBody(); built = true; }
    });
  }
  section.appendChild(body);
  return section;
}

function regionMatchesQuery(region, query){
  if(region.region.toLowerCase().includes(query)) return true;
  return region.govs.some(gov => {
    if(gov.gov.toLowerCase().includes(query)) return true;
    return gov.items.some(court => court.name.toLowerCase().includes(query) ||
      court.circuits.some(c => c.name.toLowerCase().includes(query) || (c.email||'').toLowerCase().includes(query)));
  });
}

function render(){
  const query = searchInput.value.trim().toLowerCase();
  listRoot.innerHTML = '';

  let regionsToShow = data.map((r, ri) => ({...r, idx: ri}));
  if(query){
    regionsToShow = regionsToShow.filter(r => regionMatchesQuery(r, query));
  }

  if(query && regionsToShow.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'لا توجد نتائج مطابقة لبحثك';
    listRoot.appendChild(empty);
    return;
  }

  regionsToShow.forEach(region => {
    listRoot.appendChild(buildRegionSection(region, region.idx, query));
  });
}

/* ---------- Top-level controls ---------- */

searchInput.addEventListener('input', render);

const footerNote = document.getElementById('footerNote');
footerNote.textContent = 'دليل للعرض والبحث فقط.';

loadData();

</script>

</body>
</html>
